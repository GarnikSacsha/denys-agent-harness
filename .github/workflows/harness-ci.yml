name: Harness CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Static checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate Harness structure
        run: python -m scripts.validate_harness
      - name: Run deterministic agent entry tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check static agent entry integration
        run: python -m scripts.check_agent_entry --agent all
      - name: Exercise Windows project bootstrap
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/bootstrap_smoke.ps1
